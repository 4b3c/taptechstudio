<!doctype html>
<!--
  Thank-you page template. taptech-tools' thanks/create_thanks.py fills it in and writes
  thanks/<slug>/index.html; nothing links here and robots are told not to index it.
  One screen, no scrolling, on any phone. Keep it that way: add nothing that needs a scroll.
  Placeholders: {{FIRST_NAME}} {{ORG}} {{MESSAGE}} {{SIGNED}}.
  An IF:KEY ... /IF:KEY comment pair drops what it wraps when KEY is empty.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../../favicon.png" />
  <title>Thank you, {{FIRST_NAME}} | TapTech Studio</title>
  <link rel="stylesheet" href="../../shared.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    .screen {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 22px;
    }
    .screen img { height: 56px; mix-blend-mode: multiply; }
    .for {
      font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent);
    }
    h1 {
      font-size: clamp(36px, 10vw, 60px);
      font-weight: 800; letter-spacing: -1.5px; line-height: 1.05;
    }
    h1 span { color: var(--accent); }
    .note { max-width: 420px; font-size: 16px; color: #444; line-height: 1.55; }
    .note em { display: block; margin-top: 6px; font-style: normal; font-weight: 600; color: var(--text); }
    .btn {
      background: var(--accent); color: #fff; text-decoration: none;
      font-weight: 700; font-size: 16px; padding: 15px 30px; border-radius: 12px;
    }
    .small { font-size: 12px; color: var(--muted); }
    .small a { color: inherit; }
  </style>
</head>
<body>
  <main class="screen">
    <img src="../../media/logo2.webp" alt="TapTech Studio" />
    <div>
      <div class="for">{{ORG}}</div>
      <h1>Thank you, <span>{{FIRST_NAME}}</span>.</h1>
    </div>
    <!-- IF:MESSAGE -->
    <p class="note">{{MESSAGE}}<!-- IF:SIGNED --><em>{{SIGNED}}</em><!-- /IF:SIGNED --></p>
    <!-- /IF:MESSAGE -->
    <a class="btn" href="https://app.taptechstudio.com/dashboard/login">See your taps →</a>
    <p class="small">Password by email · <a href="mailto:awpierc2@asu.edu">awpierc2@asu.edu</a></p>
  </main>
</body>
</html>
